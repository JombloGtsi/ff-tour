<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriverArus - Pendapatan & Bensin ShopeeFood</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-4xl mx-auto">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="bg-orange-500 text-white text-xs font-black px-2 py-1 rounded">SHOPEEFOOD</span>
                    <h1 class="text-xl font-bold text-orange-400">DriverArus Log</h1>
                </div>
                <p class="text-xs text-slate-400 mt-1">Pantau bersih pendapatan, bensin, dan target harianmu</p>
            </div>
            <div class="text-left md:text-right w-full md:w-auto bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                <p class="text-xs text-slate-400">Sisa Kantong (Pendapatan Bersih)</p>
                <h2 id="total-balance" class="text-2xl font-black text-orange-400">Rp 0</h2>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex justify-between items-center shadow-lg">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Total Ongkir + Tip</p>
                    <h3 id="total-income" class="text-xl font-bold text-emerald-400 mt-1">Rp 0</h3>
                </div>
                <div class="bg-emerald-500/10 p-3 rounded-xl text-emerald-400 text-lg font-bold">💰</div>
            </div>
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex justify-between items-center shadow-lg">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Bensin & Uang Makan</p>
                    <h3 id="total-expense" class="text-xl font-bold text-rose-400 mt-1">Rp 0</h3>
                </div>
                <div class="bg-rose-500/10 p-3 rounded-xl text-rose-400 text-lg font-bold">⛽</div>
            </div>
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex justify-between items-center shadow-lg">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Total Orderan (Trip)</p>
                    <h3 id="total-orders" class="text-xl font-bold text-blue-400 mt-1">0 Order</h3>
                </div>
                <div class="bg-blue-500/10 p-3 rounded-xl text-blue-400 text-lg font-bold">🛵</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 bg-slate-800 p-6 rounded-2xl border border-slate-700 h-fit shadow-xl">
                <h3 class="text-md font-bold mb-4 text-slate-200 border-b border-slate-700 pb-2">Input Hasil Tarikan</h3>
                <form id="driver-form" onsubmit="addDriverTx(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Jenis Catatan</label>
                        <select id="tx-type" onchange="toggleCategoryOptions()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 transition">
                            <option value="income">Pendapatan (Ongkir/Tip/Bonus)</option>
                            <option value="expense">Pengeluaran (Bensin/Makan/Ban)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Keterangan / Lokasi</label>
                        <input type="text" id="tx-desc" required placeholder="Contoh: Orderan Bakso Wonosari" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Nominal Rupiah (Rp)</label>
                        <input type="number" id="tx-amount" required placeholder="Masukkan jumlah uang" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Kategori Spesifik</label>
                        <select id="tx-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 transition">
                            </select>
                    </div>
                    <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold p-3 rounded-xl transition cursor-pointer text-sm shadow-md mt-2">
                        Simpan Catatan
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 space-y-4">
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex flex-wrap justify-between items-center gap-2 shadow-md">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-400 font-medium">Filter:</span>
                        <select id="filter-type" onchange="render()" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs focus:outline-none">
                            <option value="all">Semua Riwayat</option>
                            <option value="income">Hanya Pendapatan</option>
                            <option value="expense">Hanya Pengeluaran</option>
                        </select>
                    </div>
                    <button onclick="clearAllData()" class="bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 text-xs px-3 py-1.5 rounded-xl font-bold transition cursor-pointer">
                        Reset Data Hari Ini
                    </button>
                </div>

                <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
                    <div class="p-4 border-b border-slate-700 bg-slate-800/50 flex justify-between items-center">
                        <h3 class="text-sm font-bold text-slate-300">Log Jalan Driver</h3>
                        <span class="text-xs text-slate-500">Otomatis Tersimpan di HP</span>
                    </div>
                    <div id="tx-list" class="divide-y divide-slate-700 max-h-[420px] overflow-y-auto">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let driverData = JSON.parse(localStorage.getItem('shopeefood_log')) || [];

        const catOptions = {
            income: ["Argo Ongkir", "Tip Konsumen", "Bonus Insentif", "Lain-lain"],
            expense: ["Bensin", "Uang Makan", "Parkir", "Tambal Ban / Servis", "Lain-lain"]
        };

        function toggleCategoryOptions() {
            const type = document.getElementById('tx-type').value;
            const catSelect = document.getElementById('tx-category');
            catSelect.innerHTML = catOptions[type].map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function formatRupiah(num) {
            return 'Rp ' + Number(num).toLocaleString('id-ID');
        }

        function addDriverTx(e) {
            e.preventDefault();
            const type = document.getElementById('tx-type').value;
            const desc = document.getElementById('tx-desc').value.trim();
            const amount = parseFloat(document.getElementById('tx-amount').value);
            const category = document.getElementById('tx-category').value;

            if(!desc || isNaN(amount) || amount <= 0) return;

            const logEntry = {
                id: Date.now(),
                type,
                desc,
                amount,
                category,
                date: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            };

            driverData.unshift(logEntry);
            localStorage.setItem('shopeefood_log', JSON.stringify(driverData));
            render();
            
            document.getElementById('tx-desc').value = '';
            document.getElementById('tx-amount').value = '';
        }

        function deleteLog(id) {
            driverData = driverData.filter(d => d.id !== id);
            localStorage.setItem('shopeefood_log', JSON.stringify(driverData));
            render();
        }

        function clearAllData() {
            if(confirm('Hapus seluruh catatan driver hari ini?')) {
                driverData = [];
                localStorage.setItem('shopeefood_log', JSON.stringify(driverData));
                render();
            }
        }

        function render() {
            const listContainer = document.getElementById('tx-list');
            const filterValue = document.getElementById('filter-type').value;

            let filtered = driverData;
            if(filterValue !== 'all') {
                filtered = driverData.filter(d => d.type === filterValue);
            }

            let incTotal = 0;
            let expTotal = 0;
            let orderCount = 0;

            driverData.forEach(d => {
                if(d.type === 'income') {
                    incTotal += d.amount;
                    if(d.category === "Argo Ongkir") orderCount++; 
                } else {
                    expTotal += d.amount;
                }
            });

            const netProfit = incTotal - expTotal;

            document.getElementById('total-income').innerText = formatRupiah(incTotal);
            document.getElementById('total-expense').innerText = formatRupiah(expTotal);
            document.getElementById('total-orders').innerText = orderCount + ' Order';
            
            const balanceEl = document.getElementById('total-balance');
            balanceEl.innerText = formatRupiah(netProfit);
            
            if(netProfit < 0) {
                balanceEl.className = "text-2xl font-black text-rose-400";
            } else {
                balanceEl.className = "text-2xl font-black text-orange-400";
            }

            if(filtered.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-sm text-slate-500">Belum ada log tarikan hari ini. Tetap semangat, salam satu aspal!</div>`;
                return;
            }

            listContainer.innerHTML = filtered.map(d => `
                <div class="p-4 flex justify-between items-center hover:bg-slate-700/30 transition">
                    <div class="space-y-1">
                        <div class="text-sm font-semibold text-slate-200">${d.desc}</div>
                        <div class="flex items-center gap-2 text-xs text-slate-400">
                            <span class="bg-slate-950 px-2 py-0.5 rounded border border-slate-700 text-orange-400 font-medium">${d.category}</span>
                            <span>Jam ${d.date}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-sm font-bold ${d.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">
                            ${d.type === 'income' ? '+' : '-'} ${formatRupiah(d.amount)}
                        </span>
                        <button onclick="deleteLog(${d.id})" class="text-xs text-slate-500 hover:text-rose-400 p-1 font-bold cursor-pointer transition">✕</button>
                    </div>
                </div>
            `).join('');
        }

        toggleCategoryOptions();
        render();
    </script>
</body>
</html>
